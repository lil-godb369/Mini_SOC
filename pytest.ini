[pytest]
# Chạy `pytest` từ thư mục gốc là kiểm được cả backend lẫn phần học máy.
# Không dùng cấu hình này thì mỗi thư mục phải chạy pytest riêng, và trong thực
# tế điều đó có nghĩa là một trong hai bộ test sẽ không bao giờ được chạy.
testpaths =
    backend/tests
    ml/tests
    agent/tests

# Cho phép import `app.*` (backend), `preprocess`/`train`/`synthetic` (ml) và
# `mini_soc_agent.*` (agent) mà không cần cài đặt chúng như package.
pythonpath =
    backend
    ml
    agent

addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
