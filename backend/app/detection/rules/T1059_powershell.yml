id: T1059.001-suspicious-powershell
name: PowerShell / trình thông dịch lệnh đáng ngờ
description: >
  Phát hiện dấu hiệu che giấu và "download cradle" trên dòng lệnh của
  PowerShell — mẫu hành vi gần như luôn xuất hiện trong giai đoạn thực thi
  payload đầu tiên.
technique: T1059.001
technique_name: PowerShell
tactic: Execution
severity: high
enabled: true
event_type: process_create
detection:
  type: single
  logic: all
  conditions:
    - field: data.process_name
      op: in
      values: [powershell.exe, pwsh.exe, powershell, pwsh]
    - field: data.command_line
      op: regex
      values:
        - '(?:^|\s)-(?:enc|encodedcommand)\s+\S+'
        - '\b(?:downloadstring|downloadfile|invoke-expression|frombase64string)\b'
        - '\biex\s+'
        - '(?:^|\s)-(?:w|windowstyle)\s+hidden(?:\s|$)'
