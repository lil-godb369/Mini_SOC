id: T1547.001-autostart-persistence
name: Thêm giá trị tự khởi động qua Registry Run key
description: >
  Phát hiện reg.exe thêm giá trị Run/RunOnce với dữ liệu thực thi.
  Không chứng minh ghi thành công hay mã thực thi là độc hại.
technique: T1547.001
technique_name: Registry Run Keys / Startup Folder
tactic: Persistence
severity: high
enabled: true
event_type: process_create
detection:
  type: single
  logic: all
  conditions:
    - field: data.process_name
      op: in
      values: [reg.exe, reg]
    - field: data.command_line
      op: regex
      values:
        - '\breg(?:\.exe)?["\x27]?\s+add\s+["\x27]?(?:HKCU|HKLM|HKEY_CURRENT_USER|HKEY_LOCAL_MACHINE)\\Software\\(?:Wow6432Node\\)?Microsoft\\Windows\\CurrentVersion\\Run(?:Once)?(?:["\x27\s]|$)'
    - field: data.command_line
      op: regex
      values:
        - '(?:^|\s)/d\s+\S+'
